# Builds the Jupyter Book (MyST) website and publishes it to GitHub Pages.
# GitHub Pages settings for this repository must be set to deploy with "GitHub Actions".

name: Jupyter Book (via myst) GitHub Pages Deploy
on:
  push:
    # Runs on pushes to the main branch
    branches: [main]
env:
  # The website is served from https://<org>.github.io/<repo-name>/
  BASE_URL: /${{ github.event.repository.name }}

# Allow the job to publish to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Install MyST
        run: npm install -g mystmd
      - name: Build HTML Assets
        run: myst build --html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_build/html'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        